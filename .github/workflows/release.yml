name: Release

# When a version tag (e.g. `1.1.4` or `v1.1.4`) is pushed on a commit from main:
# builds the Chrome and Firefox packages, attaches them to a GitHub Release,
# and commits the tag's version to main. Tags not on main are skipped.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # Only release tags that point at a commit on main
  check-main:
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.guard.outputs.on_main }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag is on main
        id: guard
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tag $GITHUB_REF_NAME is not on main; skipping build and release"
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Firefox package
        run: npm run build:firefox

      - name: Build Chrome package
        run: npm run build:chrome

      - name: Verify package versions
        run: |
          expected="${BUILD_VERSION#v}"
          for zip in embed-link-helper-firefox.zip embed-link-helper-chrome.zip; do
            actual=$(unzip -p "$zip" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            echo "$zip -> $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$zip has version $actual, expected $expected"
              exit 1
            fi
          done

      - name: Rename packages
        run: |
          version="${BUILD_VERSION#v}"
          mv embed-link-helper-firefox.zip "embed-link-helper-firefox-${version}.zip"
          mv embed-link-helper-chrome.zip "embed-link-helper-chrome-${version}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: embed-link-helper-${{ github.ref_name }}
          path: embed-link-helper-*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" embed-link-helper-*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # After a successful build, write the tag's version back to main so the
  # repository matches the released packages.
  update-version:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set version from tag
        run: |
          version="${BUILD_VERSION#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          VERSION="$version" node -e '
            const fs = require("fs");
            for (const f of ["manifest.json", "manifest-chrome.json", "manifest-firefox.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          '
          git diff --stat

      - name: Commit and push to main
        run: |
          if git diff --quiet; then
            echo "main already has version ${BUILD_VERSION#v}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: set version to ${BUILD_VERSION#v} [skip ci]"
          git push origin HEAD:main
